# Example entries for ~/.ssh/config.d/<identity>.conf
#
# This file is a REFERENCE - not deployed by chezmoi (the docs/ directory is
# listed in .chezmoiignore). Copy whats needed into actual per-machine
# files like ~/.ssh/config.d/personal.conf or ~/.ssh/config.d/work.conf.
#
# Conventions used in the comments below:
#   <alias>      - short name you'll type (`ssh <alias>`)
#   <hostname>   - real DNS name or IP
#   <user>       - login on the remote host
#   <key>        - filename under ~/.ssh/, e.g. id_ed25519
#
# Reminder: SSH evaluates ALL matching Host blocks top-down, first value for
# each option wins. Specific blocks should come BEFORE wildcards.

# =============================================================================
# 1. GitHub - single account
# =============================================================================
# Typical pattern: one ed25519 key for your main GitHub identity.

# Host github.com
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/id_ed25519
#     IdentitiesOnly yes


# =============================================================================
# 2. GitHub - multiple accounts (personal + work)
# =============================================================================
# Trick: use a fake hostname as the alias. Then in git remotes, use that fake
# host instead of github.com:
#
#   git clone git@github.com-work:org/repo.git   (instead of git@github.com:...)
#
# SSH resolves "github.com-work" → real github.com via HostName, while picking
# the right key from IdentityFile.

# Host github.com
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/id_ed25519_personal
#     IdentitiesOnly yes
#
# Host github.com-work
#     HostName github.com
#     User git
#     IdentityFile ~/.ssh/id_ed25519_work
#     IdentitiesOnly yes


# =============================================================================
# 3. Aliased server - friendly name for an IP or long hostname
# =============================================================================
# `ssh homelab` instead of `ssh pipe@192.168.50.252`. The alias only exists
# locally; the remote sees the real hostname.

# Host homelab
#     HostName 192.168.50.252
#     User pipe
#     IdentityFile ~/.ssh/id_ed25519


# =============================================================================
# 4. Server with multiple candidate keys
# =============================================================================
# Useful when one machine is reachable with either of two keys (e.g., personal
# admin key + service-specific key). SSH tries them in order until one works.
# `IdentitiesOnly yes` prevents the agent from offering unrelated keys first
# (which can trip rate limits or "too many auth failures" errors).

# Host prod-db
#     HostName db.internal.example.com
#     User deploy
#     IdentityFile ~/.ssh/personal_admin
#     IdentityFile ~/.ssh/prod_deploy
#     IdentitiesOnly yes


# =============================================================================
# 5. ProxyJump - bastion / jump host
# =============================================================================
# `ssh prod` automatically hops through `bastion` first. SSH opens the tunnel
# under the hood; you only see the final shell.

# Host bastion
#     HostName bastion.example.com
#     User andres
#     IdentityFile ~/.ssh/id_ed25519
#
# Host prod-app
#     HostName 10.0.0.42                # private IP, only reachable via bastion
#     User app
#     IdentityFile ~/.ssh/prod_deploy
#     ProxyJump bastion


# =============================================================================
# 6. Wildcard for a whole VPC / domain
# =============================================================================
# Apply settings to every host in a network without listing them individually.
# Specific blocks above this still win because SSH takes the first match.

# Host *.internal.example.com
#     User andres
#     IdentityFile ~/.ssh/work_internal
#     IdentitiesOnly yes
#     ProxyJump bastion


# =============================================================================
# 7. SSH agent forwarding (use with care)
# =============================================================================
# Forwards your local SSH agent into the remote session so you can `git push`
# from the remote without copying private keys onto it. Only enable for hosts
# you fully trust - a compromised remote can use your forwarded keys.

# Host dev-box
#     HostName dev.example.com
#     User andres
#     IdentityFile ~/.ssh/id_ed25519
#     ForwardAgent yes


# =============================================================================
# 8. Match exec - conditional config
# =============================================================================
# Advanced pattern: apply settings only when an arbitrary shell check passes.
# Example below: use a corporate key only when connected to the work VPN
# (detected by a route to a known internal address).

# Match host *.corp originalhost work-jump exec "nc -z -w1 10.10.0.1 22"
#     IdentityFile ~/.ssh/work_corp
#     IdentitiesOnly yes
