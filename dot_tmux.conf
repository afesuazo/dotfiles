# ~/.tmux.conf

# 256 colors + truecolor passthrough (needed for modern nvim themes).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Enable mouse mode
set -g mouse on

# Use vim keybindings
setw -g mode-keys vi

# Prefix-based pane select (kept as a backup to vim-tmux-navigator).
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g history-limit 200000
set -g base-index 0
setw -g pane-base-index 0

# Faster escape for vim-like modes
set -sg escape-time 10

# Intuitive split keys
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Easy reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# ---------- Status bar (Dawnfox palette) ----------
# Hex values pulled from dot_config/ghostty/themes/dawnfox.
set -g status-position bottom
set -g status-justify left
set -g status-interval 5

set -g status-style              "bg=#d0d8d8,fg=#575279"
set -g status-left-length        40
set -g status-right-length       80
set -g status-left   "#[bg=#286983,fg=#faf4ed,bold] #S #[bg=#d0d8d8,fg=#286983]"
set -g status-right  "#[fg=#907aa9]#H #[fg=#575279]| %Y-%m-%d %H:%M "

set -g window-status-format         " #I:#W "
set -g window-status-current-format "#[bg=#907aa9,fg=#faf4ed,bold] #I:#W #[bg=#d0d8d8,fg=#907aa9]"

set -g pane-border-style        "fg=#d0d8d8"
set -g pane-active-border-style "fg=#286983"

set -g message-style "bg=#286983,fg=#faf4ed"

# ---------- Plugins (TPM) ----------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Auto-install TPM on first run if missing, then install listed plugins.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm \
         && ~/.tmux/plugins/tpm/bin/install_plugins'"

# MUST stay at the very bottom — initializes TPM.
run '~/.tmux/plugins/tpm/tpm'
